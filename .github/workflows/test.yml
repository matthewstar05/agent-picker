name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Windows timezone support
        if: runner.os == 'Windows'
        run: python -m pip install tzdata "tzlocal>=5,<6"
      - name: Test shared behavior and native process launch
        run: python scripts/run_tests.py
      - name: Validate profiles without opening agent sessions
        run: python src/agent_picker.py --picker-doctor
      - name: Install into an isolated profile and launch a fake provider
        run: python scripts/smoke_install.py
