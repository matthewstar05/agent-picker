name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test shared behavior and native process launch
        run: python -m unittest discover -s tests -v
      - name: Validate profiles without opening agent sessions
        run: python src/agent_picker.py --picker-doctor
